services:
  - type: web
    name: cloud-riscv-backend
    runtime: docker
    dockerfilePath: ./Dockerfile
    plan: free
    region: oregon
    healthCheckPath: /api/health
    envVars:
      - key: PORT
        value: 8000
      - key: CORS_ORIGINS
        value: "http://localhost:3000,http://127.0.0.1:3000"
      - key: CORS_ORIGIN_REGEX
        value: "^https://.*\\.vercel\\.app$"
      - key: USE_WSL
        value: "0"

